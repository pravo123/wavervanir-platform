name: Desk design contract
on:
  pull_request:
    branches: ["cbsrm-golive"]
permissions:
  contents: read
jobs:
  desk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e "api[dev]"
      - name: Start app against PostgreSQL
        env:
          WAVERVANIR_ENV: test
          WAVERVANIR_DB_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/postgres
          WAVERVANIR_ADMIN_EMAILS: ""
        run: python -c "from wavervanir_api.app import create_app; create_app()"
      - run: node --check api/src/wavervanir_api/web/brand/cbsrm-desk.js
      - run: node api/tests/test_demo_source_switch.cjs
      - run: node api/tests/test_auth_recovery.cjs
      - run: python -m pytest -q -o addopts="" api/tests/test_users_auth.py api/tests/test_desk_portfolio.py api/tests/test_desk_pipeline.py api/tests/test_demo_source_integration.py api/tests/test_conditions_cache_contract.py api/tests/test_desk_cache.py api/tests/test_hardening.py
      - run: npm ci && npm run build
        working-directory: landing
