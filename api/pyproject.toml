[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wavervanir-api"
version = "0.1.0"
description = "Hosted CBSRM research API — public methodology, authenticated SaaS surface."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "WaverVanir International LLC" },
]
keywords = ["systemic-risk", "saas", "cbsrm", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "fastapi>=0.111",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlmodel>=0.0.16",
    "httpx>=0.27",
    "stripe>=8.0",
    "uvicorn[standard]>=0.29",
    "email-validator>=2.1",
    "psycopg2-binary>=2.9",   # Postgres driver (prod); SQLite needs no driver
    "psycopg[binary]>=3.2",    # SQLAlchemy 2.1's default PostgreSQL driver
    "numpy>=1.26",            # Diebold-Yilmaz spillover (VAR + generalized FEVD)
    "pandas>=2.0",            # quarterly resampling of the cbsrm indicator series
    # The hosted API depends on the PUBLIC cbsrm package only.
    # Pinned to the exact commit the v0.9.0 tag resolved to on 2026-10-19 (a tag
    # can move; a commit cannot). Same code, same version 0.9.0.
    # Operators developing locally can override with: pip install -e ../../cbsrm
    "cbsrm @ git+https://github.com/pravo123/cbsrm.git@4f76889273121ffffc5c2006c982f757afebea5d",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
# The CBSRM MCP server (agent-callable governed systemic risk). Optional so the
# core API doesn't depend on the MCP SDK. Install with: pip install -e '.[mcp]'
mcp = [
    "mcp>=1.2",
]

[project.scripts]
cbsrm-mcp = "wavervanir_api.mcp_server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
