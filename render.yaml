# ============================================================================
# render.yaml — one-click Render Blueprint for the wavervanir-platform API.
# ----------------------------------------------------------------------------
# WHAT THIS IS
#   A Render "Blueprint" (Infrastructure-as-Code). From the Render dashboard:
#       New + > Blueprint > connect this GitHub repo > pick branch > Apply.
#   Render reads this file and provisions, in one shot:
#     - a Python web service `wavervanir-api` (the FastAPI app, factory mode)
#     - a managed Postgres database `wavervanir-pg`
#   and wires WAVERVANIR_DB_URL from the database into the web service.
#
# WHAT RENDER FILLS IN AUTOMATICALLY
#   - WAVERVANIR_DB_URL ............ injected from the wavervanir-pg connection.
#   - WAVERVANIR_API_KEY_PEPPER .... generated by Render (generateValue: true),
#                                    a strong random secret you never see/commit.
#   - WAVERVANIR_JWT_SECRET ........ generated by Render — signs the CBSRM Desk
#                                    user login (access/refresh JWTs).
#
# WHAT THE OPERATOR STILL MUST PASTE BY HAND (Render dashboard >
# wavervanir-api > Environment). These ship here as `sync: false` so Render
# prompts for them at Apply time and never stores a value in git:
#     STRIPE_API_KEY          sk_test_...   (test-mode restricted key)
#     STRIPE_WEBHOOK_SECRET   whsec_...     (obtained AFTER registering webhook)
#     STRIPE_PRICE_RESEARCHER price_...     (Stripe Price id for the $49 tier)
#     STRIPE_PRICE_PRO        price_...     (Stripe Price id for the $499 tier)
#     STRIPE_PRICE_DESK       price_...     (Stripe Price id for the $48k/yr Desk)
#
# The two data-feed keys (FRED_API_KEY, FINANCIALDATA_API_KEY) now live in the
# shared `wavervanir-data-keys` env group (see envVarGroups below) — pasted once
# in the Render UI and linked to BOTH the web service and the cron.
#
# SECURITY: never put sk_*, whsec_*, or any real secret in this committed file.
# Only env-var NAMES live here; values are entered in the Render UI.
#
# Env-var names below are validated against api/src/wavervanir_api/config.py
# (Settings aliases) and api/src/wavervanir_api/plans.py (STRIPE_PRICE_*).
# ============================================================================

databases:
  - name: wavervanir-pg
    databaseName: wavervanir
    # NOTE: Render deletes a `free` Postgres after 90 days (data + minted API
    # keys + waitlist rows go with it). Upgrade to the $7 `starter` plan in the
    # Render UI before expiry. See DEPLOY_QUICKSTART.md Step 1.
    plan: free

# Shared data-provider keys — one source of truth, linked to BOTH the web
# service and the cron (created + linked live 2026-07-02). Values are pasted
# once into the group in the Render UI (sync:false → never in git).
envVarGroups:
  - name: wavervanir-data-keys
    envVars:
      - key: FRED_API_KEY
        sync: false
      - key: FINANCIALDATA_API_KEY
        sync: false

services:
  - type: web
    name: wavervanir-api
    runtime: python
    rootDir: api
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: pip install --upgrade pip && pip install -e .
    startCommand: uvicorn wavervanir_api.app:create_app --factory --host 0.0.0.0 --port $PORT
    envVars:
      # --- Set by this blueprint -------------------------------------------
      - key: WAVERVANIR_ENV
        value: staging
      - key: WAVERVANIR_RATE_LIMIT_FREE
        value: "100"
      # Send HSTS (the service is TLS-fronted by Render). Off by default in
      # config.py so local http dev isn't broken.
      - key: WAVERVANIR_HSTS_ENABLED
        value: "true"
      # Optional ops alert webhook on 5xx (Slack/Discord/generic). Blank = off.
      - key: ALERT_WEBHOOK_URL
        sync: false
      # --- Generated by Render (strong random secrets, never shown/committed) -
      - key: WAVERVANIR_API_KEY_PEPPER
        generateValue: true
      - key: WAVERVANIR_JWT_SECRET
        generateValue: true
      # --- Injected from the managed Postgres database above ----------------
      - key: WAVERVANIR_DB_URL
        fromDatabase:
          name: wavervanir-pg
          property: connectionString
      # --- Operator-pasted secrets (sync:false => prompt at Apply, no value) -
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_RESEARCHER
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_DESK
        sync: false
      - key: STRIPE_PAYMENT_LINK_DESK
        sync: false
    # FRED_API_KEY + FINANCIALDATA_API_KEY come from the shared group above.
    envVarGroups:
      - wavervanir-data-keys

  # --------------------------------------------------------------------------
  # Cache-warm cron — recomputes the live 13-lens conditions snapshot every
  # 45 min (TTL is 1h) into the SHARED Postgres SnapshotCache, so customers hit
  # a warm cache instead of paying the ~15-20s cold multi-upstream build. Uses
  # the SAME wavervanir-pg database as the web service so the cache is visible
  # to it. NOTE: adding a service requires an operator Blueprint re-apply in Render.
  # --------------------------------------------------------------------------
  - type: cron
    name: wavervanir-conditions-warmer
    runtime: python
    rootDir: api
    schedule: "*/45 * * * *"
    buildCommand: pip install --upgrade pip && pip install -e .
    startCommand: python -m wavervanir_api.tools.refresh_conditions
    envVars:
      - key: WAVERVANIR_DB_URL
        fromDatabase:
          name: wavervanir-pg
          property: connectionString
    # FRED_API_KEY + FINANCIALDATA_API_KEY come from the shared group above.
    envVarGroups:
      - wavervanir-data-keys
